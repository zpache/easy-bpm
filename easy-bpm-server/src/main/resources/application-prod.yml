spring:
  datasource:
    # 生产库：腾讯云 MySQL（REDACTED@easy_bpm），明文配置（仓库私有，密码变更需同步此处）
    url: jdbc:mysql://REDACTED_HOST/easy_bpm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: REDACTED
    password: REDACTED
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  sql:
    init:
      # 生产库结构由 db/mysql 下的脚本人工执行，避免应用启动时改表
      mode: never

flowable:
  database-schema-update: false

easybpm:
  demo:
    enabled: false
