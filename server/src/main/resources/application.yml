server:
  port: 8090
  shutdown: graceful

spring:
  application:
    name: easy-bpm
  profiles:
    # local 存放本机私有配置（数据库密码等），已被 gitignore，缺失时不影响启动
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  threads:
    virtual:
      enabled: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: input

# Flowable 8 流程引擎。schema 由引擎自动维护；生产环境建议改为 false 并用官方 SQL 初始化
flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: audit

easybpm:
  security:
    jwt-secret: ${EASY_BPM_JWT_SECRET:easy-bpm-dev-secret-change-me-2026-11-09}
    token-ttl-hours: ${EASY_BPM_TOKEN_TTL_HOURS:12}
    # 敏感字段（手机号/邮箱/AppSecret）落库加密密钥，任意长度字符串经 SHA-256 派生
    # 未配置时使用内置开发密钥（启动告警）；生产必须配置 EASY_BPM_DATA_KEY
    data-key: ${EASY_BPM_DATA_KEY:}
    # 密钥轮换用的旧密钥：仅解密，启动迁移会把旧密文重写为新密钥
    data-key-previous: ${EASY_BPM_DATA_KEY_PREVIOUS:}
  demo:
    enabled: ${EASY_BPM_DEMO_ENABLED:true}
  webhook:
    enabled: ${EASY_BPM_WEBHOOK_ENABLED:true}
    poll-interval-ms: 30000
    max-attempts: 5
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
  open:
    # OpenAPI 单机限流（次/分钟，按 AppKey），0 表示关闭
    rate-limit-per-minute: ${EASY_BPM_RATE_LIMIT:600}
  sso:
    # 控制台单点登录总开关，关闭后登录页不再探测、授权接口直接拒绝
    enabled: ${EASY_BPM_SSO_ENABLED:true}
    # 控制台对外地址，回调成功后跳回这里（经网关/反代时必须配成外部可访问地址）
    console-base-url: ${EASY_BPM_CONSOLE_BASE_URL:http://localhost:8091}
    # 默认回调地址，必须与 IdP 侧登记的 redirect_uri 完全一致；租户配置可覆盖
    default-redirect-uri: ${EASY_BPM_SSO_REDIRECT_URI:http://localhost:8091/api/auth/sso/callback}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# 日志框架与级别统一在 logback-spring.xml 管理（含 traceId、滚动归档、异步写入）
