spring:
  datasource:
    url: ${EASY_BPM_DB_URL}
    username: ${EASY_BPM_DB_USERNAME}
    password: ${EASY_BPM_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  sql:
    init:
      # 生产库结构由 db/mysql 下的脚本人工执行，避免应用启动时改表
      mode: never

flowable:
  database-schema-update: false

easybpm:
  demo:
    enabled: false
