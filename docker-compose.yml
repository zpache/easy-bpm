# easy-bpm 一键部署：MySQL 8.4 + 服务端 + 控制台
#
# 前置（宿主机一次性执行）：
#   1. 构建后端 jar：cd server && JAVA_HOME=<corretto-25> mvn -DskipTests package
#   2. 生产库结构由 db/mysql/schema.sql 初始化（mysql 容器首次启动自动执行）
#
# 启动：docker compose up -d --build
# 访问：控制台 http://localhost:80/  服务端 http://localhost:8090/

services:
  mysql:
    image: mysql:8.4
    container_name: easy-bpm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${EASY_BPM_DB_PASSWORD:?请通过 .env 或环境变量提供数据库密码}
      MYSQL_DATABASE: easy_bpm
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${EASY_BPM_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: easy-bpm-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EASY_BPM_DB_URL: jdbc:mysql://mysql:3306/easy_bpm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
      EASY_BPM_DB_USERNAME: root
      EASY_BPM_DB_PASSWORD: ${EASY_BPM_DB_PASSWORD}
      EASY_BPM_JWT_SECRET: ${EASY_BPM_JWT_SECRET:?请提供 JWT 密钥（32 位以上随机串）}
      EASY_BPM_WEBHOOK_ENABLED: ${EASY_BPM_WEBHOOK_ENABLED:-true}
      EASY_BPM_RATE_LIMIT: ${EASY_BPM_RATE_LIMIT:-600}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8090:8090"
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: console/Dockerfile
    container_name: easy-bpm-console
    depends_on:
      - server
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mysql-data:
